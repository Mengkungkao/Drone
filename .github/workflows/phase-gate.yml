# Runs the Phase 0 evidence gate on every push and pull request.
#
# The gate is not a compile check. check:foundation ends by starting the binary this
# job just built: check:launch reads SQLite after two real launches, and check:operator
# drives the running window over WebDriver. Both need the GTK/WebKit stack, a display
# and a WebDriver, so the job installs them rather than assuming a desktop runner.
name: Phase gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: drone-platform

jobs:
  desktop:
    name: Desktop foundation and launch gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Tauri links the shell against these at build time; xvfb and the WebKit driver
      # are what let the launch gates start a real window on a headless runner.
      - name: Install desktop and launch prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential xvfb webkit2gtk-driver

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: drone-platform/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: drone-platform

      - name: Install tauri-driver
        run: |
          if ! command -v tauri-driver >/dev/null; then
            cargo install tauri-driver --locked
          fi

      # --include=dev guards against a runner that exports NODE_ENV=production, which
      # would silently omit the Tauri CLI and fail desktop:build with "tauri: not found".
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Environment gate
        run: npm run check:environment

      - name: Unit checks
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Preserved PX4 source checks
        run: |
          python -m pip install --quiet pytest
          bash tests/test_platform.sh
          python -m pytest -q tests

      # check:foundation launches this artifact, so it has to exist first.
      - name: Build the desktop binary
        run: npm run desktop:build

      - name: Phase 0 gate
        run: npm run check:foundation

      # The evidence is the point of the gate, and a failure is exactly when someone
      # needs the screenshots and per-check records to see what the window did.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-gate-evidence-${{ github.run_id }}
          path: drone-platform/logs/
          retention-days: 14
          if-no-files-found: warn
